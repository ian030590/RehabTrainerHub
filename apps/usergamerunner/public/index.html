<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <title>居家訓練網｜隔離遊戲執行環境</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        box-sizing: border-box;
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 2rem;
        place-items: center;
        background: Canvas;
        color: CanvasText;
      }
      main {
        width: min(38rem, 100%);
        padding: 2rem;
        border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
        border-radius: 1rem;
      }
      h1 { margin-top: 0; }
      p { line-height: 1.7; }
    </style>
  </head>
  <body>
    <main>
      <h1>隔離遊戲執行環境</h1>
      <p>這個獨立網站只執行居家訓練網已核准的遊戲檔案，不處理登入、個人資料或帳號憑證。</p>
      <p>請從居家訓練網選擇遊戲；此入口沒有可瀏覽的遊戲目錄。</p>
    </main>
  </body>
</html>
