<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工作記憶更新 / N-Back</title>
  <link rel="stylesheet" href="jspsych.css">
  <link rel="stylesheet" href="default_style.css">
  <link rel="stylesheet" href="style.css">
  <style>
    html, body { width: 100%; height: 100%; min-height: 100%; margin: 0; overflow: hidden; }
    .jspsych-display-element { position: fixed; inset: 0; width: 100vw !important; height: 100vh !important; min-height: 100dvh; margin: 0 !important; padding: 0 !important; overflow: hidden; background: #fff !important; }
    .display_stage_background { position: fixed; inset: 0; width: 100vw; height: 100dvh; background: #fff; }
    .display_stage { position: fixed; inset: 0; width: 100vw; height: 100vh; min-height: 100dvh; margin: 0; padding: 30px; border: 0; border-radius: 0; box-shadow: none; background: #fff; overflow: auto; }
    .bilingual-centerbox { position: absolute; top: 50%; left: 50%; display: flex; width: min(76vw, 56rem); max-width: calc(100vw - 3rem); max-height: calc(100% - 3rem); height: auto; margin: 0; transform: translate(-50%, -50%); flex-direction: column; justify-content: center; gap: 1.25rem; overflow: auto; text-align: center; }
    .bilingual-centerbox .bilingual-copy { width: 100%; flex: 0 0 auto; }
    .bilingual-centerbox .bilingual-copy-zh .block-text, .bilingual-centerbox .bilingual-copy-en .block-text, .bilingual-centerbox .bilingual-copy-zh .center-block-text, .bilingual-centerbox .bilingual-copy-en .center-block-text { width: 100%; height: auto; margin: 0; text-align: center; }
  </style>
</head>
<body data-game-id="n-back" data-timeline="n_back_experiment">
  <script src="js/jquery.min.js"></script>
  <script src="js/math.min.js"></script>
  <script src="js/jspsych/jspsych.js"></script>
  <script src="js/jspsych/plugins/jspsych-text.js"></script>
  <script src="js/jspsych/poldrack_plugins/jspsych-poldrack-text.js"></script>
  <script src="js/jspsych/poldrack_plugins/jspsych-poldrack-categorize.js"></script>
  <script src="js/jspsych/poldrack_plugins/jspsych-poldrack-instructions.js"></script>
  <script src="js/jspsych/plugins/jspsych-call-function.js"></script>
  <script src="js/jspsych/poldrack_plugins/jspsych-attention-check.js"></script>
  <script src="js/jspsych/poldrack_plugins/jspsych-poldrack-single-stim.js"></script>
  <script src="js/jspsych/plugins/jspsych-survey-text.js"></script>
  <script src="js/jspsych/poldrack_plugins/jspsych-single-stim-button.js"></script>
  <script src="js/jspsych/poldrack_plugins/poldrack_utils.js"></script>
  <script src="experiment.js"></script>
  <script>
    window.rehabBilingualize = function () {
      function makeBilingualCenterbox(chinese, english) {
        var englishMarkup = String(english);
        var centerbox = englishMarkup.match(/^\s*<div\s+class\s*=\s*["']?centerbox["']?\s*>([\s\S]*)<\/div>\s*$/i);
        if (centerbox) englishMarkup = centerbox[1];
        return '<div class="centerbox bilingual-centerbox"><div class="bilingual-copy bilingual-copy-zh" lang="zh-TW"><p class="block-text">' + chinese + '</p></div><div class="bilingual-copy bilingual-copy-en" lang="en">' + englishMarkup + '</div></div>';
      }

      var specs = [["start_practice_block","text","接下來先進行練習。判斷目前字母是否與指定間隔前相同，按 Enter 開始。"],["start_test_block","text","練習結束，接下來進入正式試次。按 Enter 開始。"],["start_control_block","text","接下來進入控制區段。依畫面規則判斷並按 Enter 開始。"],["start_delay_block","text","作答間隔即將改變。請依畫面提示的新規則作答。"],["end_block","text","本次作業已完成。按 Enter 查看當次紀錄。"]];
      specs.push(['feedback_instruct_block', 'text', '請再閱讀作答規則，準備好後按 Enter 重新練習。']);
      specs.forEach(function (spec) {
        var trial = window[spec[0]];
        var property = spec[1];
        if (!trial || (typeof trial[property] !== 'string' && typeof trial[property] !== 'function')) return;
        var original = trial[property];
        trial[property] = function () {
          var english = typeof original === 'function' ? original.apply(this, arguments) : original;
          return makeBilingualCenterbox(spec[2], english);
        };
      });
      var questionnaire = window.post_task_block;
      if (questionnaire && Array.isArray(questionnaire.questions) && questionnaire.questions.length) {
        var prompt = '<p class="center-block-text" lang="zh-TW">請簡述這個作業要求你做什麼。</p>';
        if (Array.isArray(questionnaire.questions[0])) questionnaire.questions[0][0] = prompt + questionnaire.questions[0][0];
        else questionnaire.questions[0] = prompt + questionnaire.questions[0];
      }
    };
  </script>
  <script src="research.js"></script>
  <script src="rehab-bridge.js"></script>
</body>
</html>
