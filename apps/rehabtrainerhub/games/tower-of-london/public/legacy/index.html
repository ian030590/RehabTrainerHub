<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>倫敦塔規劃 / Tower of London</title>
  <link rel="stylesheet" href="jspsych.css">
  <link rel="stylesheet" href="default_style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-game-id="tower-of-london" data-timeline="tower_of_london_experiment">
  <script src="js/jquery.min.js"></script>
  <script src="js/math.min.js"></script>
  <script src="jspsych/jspsych.js"></script>
  <script src="jspsych/plugins/jspsych-text.js"></script>
  <script src="jspsych/poldrack_plugins/jspsych-poldrack-text.js"></script>
  <script src="jspsych/poldrack_plugins/jspsych-poldrack-instructions.js"></script>
  <script src="jspsych/poldrack_plugins/jspsych-attention-check.js"></script>
  <script src="jspsych/poldrack_plugins/jspsych-single-stim-button.js"></script>
  <script src="jspsych/poldrack_plugins/jspsych-poldrack-single-stim.js"></script>
  <script src="jspsych/plugins/jspsych-survey-text.js"></script>
  <script src="jspsych/poldrack_plugins/poldrack_utils.js"></script>
  <script src="experiment.js"></script>
  <script>
    window.rehabBilingualize = function () {
      var specs = [["start_test_block","text","請用最少移動次數把起始配置變成目標配置。按 Enter 開始。"],["end_block","text","本次作業已完成。按 Enter 查看當次紀錄。"]];
      specs.push(['feedback_instruct_block', 'text', '請再閱讀作答規則，準備好後按 Enter 重新練習。']);
      specs.forEach(function (spec) {
        var trial = window[spec[0]];
        var property = spec[1];
        if (!trial || (typeof trial[property] !== 'string' && typeof trial[property] !== 'function')) return;
        var original = trial[property];
        trial[property] = function () {
          var english = typeof original === 'function' ? original.apply(this, arguments) : original;
          return '<div class="centerbox"><p class="block-text" lang="zh-TW">' + spec[2] + '</p></div>' + english;
        };
      });
      var questionnaire = window.post_task_block;
      if (questionnaire && Array.isArray(questionnaire.questions) && questionnaire.questions.length) {
        var prompt = '<p class="center-block-text" lang="zh-TW">請簡述這個作業要求你做什麼。</p>';
        if (Array.isArray(questionnaire.questions[0])) questionnaire.questions[0][0] = prompt + questionnaire.questions[0][0];
        else questionnaire.questions[0] = prompt + questionnaire.questions[0];
      }
    };
  </script>
  <script src="rehab-bridge.js"></script>
</body>
</html>
