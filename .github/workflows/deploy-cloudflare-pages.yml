name: Deploy Cloudflare Pages

on:
  push:
    branches: ["main"]
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "cloudflare-pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: naming
            command: npm run test:naming
          - name: pwa
            command: npm run test:pwa
          - name: game-architecture
            command: npm run test:game-architecture
          - name: hub-functions
            command: npm run test:hub-functions
          - name: gamerunner
            command: npm run test:gamerunner
          - name: trainer-entrypoints
            command: npm run test:entrypoints
          - name: cloudflare-deploy
            command: npm run test:cloudflare-deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --workspaces --include-workspace-root

      - name: Run verification
        run: ${{ matrix.command }}

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --workspaces --include-workspace-root

      - name: Discover Pages app environment
        run: node scripts/write-pages-env.mjs >> "$GITHUB_ENV"

      - name: Check runtime asset changes
        id: runtime-assets
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            BEFORE="$GITHUB_SHA^"
          fi
          if ! git rev-parse --verify "$BEFORE^{commit}" >/dev/null 2>&1 || ! git diff --quiet "$BEFORE" "$GITHUB_SHA" -- scripts/r2-ai-assets.manifest.json scripts/r2-cors.json; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure production R2 runtime asset CORS
        if: ${{ github.ref == 'refs/heads/main' && vars.R2_AI_ASSET_BUCKET != '' && steps.runtime-assets.outputs.changed == 'true' }}
        run: npx --yes wrangler@4 r2 bucket cors set "$R2_AI_ASSET_BUCKET" --file scripts/r2-cors.json
        env:
          R2_AI_ASSET_BUCKET: ${{ vars.R2_AI_ASSET_BUCKET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Sync production R2 runtime assets
        if: ${{ github.ref == 'refs/heads/main' && vars.R2_AI_ASSET_BUCKET != '' && steps.runtime-assets.outputs.changed == 'true' }}
        run: npm run sync:r2-ai-assets
        env:
          R2_AI_ASSET_BUCKET: ${{ vars.R2_AI_ASSET_BUCKET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build all apps
        run: npm run build:cloudflare:only
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_TURNSTILE_AUTH_REQUIRED: ${{ vars.TURNSTILE_REQUIRED }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          VITE_TURNSTILE_AUTH_REQUIRED: ${{ vars.TURNSTILE_REQUIRED }}
          VITE_TURNSTILE_RECORDS_REQUIRED: ${{ vars.TURNSTILE_RECORDS_REQUIRED }}
          NEXT_PUBLIC_CF_WEB_ANALYTICS_TOKEN: ${{ vars.CF_WEB_ANALYTICS_TOKEN }}
          VITE_CF_WEB_ANALYTICS_TOKEN: ${{ vars.CF_WEB_ANALYTICS_TOKEN }}
          VITE_AI_ASSET_BASE_URL: ${{ github.ref == 'refs/heads/main' && vars.AI_ASSET_BASE_URL || '' }}

      - name: Ensure and deploy Cloudflare Pages projects
        timeout-minutes: 15
        run: node scripts/deploy-cloudflare-pages.mjs --branch=${{ github.ref_name }} --production-branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_SESSION_SECRET: ${{ secrets.AUTH_SESSION_SECRET }}
          AUTH_STATE_SECRET: ${{ secrets.AUTH_STATE_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          TURNSTILE_REQUIRED: ${{ vars.TURNSTILE_REQUIRED }}
          TURNSTILE_RECORDS_REQUIRED: ${{ vars.TURNSTILE_RECORDS_REQUIRED }}
          CF_WEB_ANALYTICS_TOKEN: ${{ vars.CF_WEB_ANALYTICS_TOKEN }}
          AI_ASSET_BASE_URL: ${{ vars.AI_ASSET_BASE_URL }}
          ASSET_PUBLIC_BASE_URL: ${{ vars.ASSET_PUBLIC_BASE_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
