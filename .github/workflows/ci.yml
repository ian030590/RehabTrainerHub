name: CI

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".node-version"
      - ".npmrc"
      - "turbo.json"
      - ".github/workflows/**"
  push:
    branches-ignore: ["main"]
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".node-version"
      - ".npmrc"
      - "turbo.json"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pnpm-policy
            command: pnpm run test:pnpm-policy
          - name: architecture-invariants
            command: pnpm run test:architecture
          - name: training-contracts
            command: pnpm run test:training-contracts
          - name: heavy-load-boundary
            command: pnpm run test:heavy-load-boundary
          - name: game-validator-state
            command: pnpm run test:game-validator
          - name: naming
            command: pnpm run test:naming
          - name: pwa
            command: pnpm run test:pwa
          - name: hub-functions
            command: pnpm run test:hub-functions
          - name: gamerunner
            command: pnpm run test:gamerunner
          - name: trainer-entrypoints
            command: pnpm run test:entrypoints
          - name: cloudflare-deploy
            command: pnpm run test:cloudflare-deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run verification
        run: ${{ matrix.command }}
