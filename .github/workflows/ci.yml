name: CI

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".node-version"
      - ".npmrc"
      - "turbo.json"
      - ".github/workflows/**"
  push:
    branches-ignore: ["main"]
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".node-version"
      - ".npmrc"
      - "turbo.json"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pnpm-policy
            command: pnpm run test:pnpm-policy
          - name: repository-health
            command: pnpm run test:repository-health
          - name: architecture-invariants
            command: pnpm run test:architecture
          - name: training-protocol
            command: pnpm run test:training-protocol
          - name: bundle-budgets
            command: pnpm run test:bundle-budgets
          - name: training-integration
            command: pnpm run test:training-integration
          - name: training-contracts
            command: pnpm run test:training-contracts
          - name: training-startability-state
            command: pnpm run test:training-startability-state
          - name: official-training-runtime-browser
            command: pnpm run test:official-training-runtime-browser
          - name: heavy-load-boundary
            command: pnpm run test:heavy-load-boundary
          - name: media-lifecycle
            command: pnpm run test:media-lifecycle
          - name: training-lifecycle
            command: pnpm run test:training-lifecycle
          - name: training-privacy
            command: pnpm run test:training-privacy
          - name: game-validator-state
            command: pnpm run test:game-validator
          - name: game-review-security
            command: pnpm run test:game-review-security
          - name: naming
            command: pnpm run test:naming
          - name: pwa
            command: pnpm run test:pwa
          - name: offline-packs
            command: pnpm run test:offline-packs
          - name: hub-functions
            command: pnpm run test:hub-functions
          - name: gamerunner
            command: pnpm run test:gamerunner
          - name: trainer-entrypoints
            command: pnpm run test:entrypoints
          - name: cloudflare-deploy
            command: pnpm run test:cloudflare-deploy
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run verification
        run: ${{ matrix.command }}
