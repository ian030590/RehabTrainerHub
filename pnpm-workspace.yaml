packages:
  - 'packages/*'
  - 'apps/*'

allowBuilds:
  core-js: true
  esbuild: true

# Keep the standard isolated linker on a normal local disk. Workspace packages
# are linked by pnpm and registry packages use pnpm's clone/hardlink/copy
# fallback, which keeps dependency declarations honest and reproducible.
nodeLinker: isolated
packageImportMethod: auto
preferSymlinkedExecutables: true
symlink: true
