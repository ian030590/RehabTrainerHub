name = "trainerhubsync"
main = "index.js"
compatibility_date = "2026-10-24"
workers_dev = false
preview_urls = false

[triggers]
crons = ["17 * * * *"]

[observability]
enabled = true

[vars]
PCLOUD_API_HOST = "eapi.pcloud.com"
PCLOUD_ROOT_FOLDER = "/4_RehabTrainerHubData"

[[r2_buckets]]
binding = "RAW_DATA"
bucket_name = "rehab-raw-data"

[[r2_buckets]]
binding = "OCULOMOTOR_DATA"
bucket_name = "oculomotor-data"

# Server-only secret: PCLOUD_ACCESS_TOKEN (pCloud OAuth access token).
